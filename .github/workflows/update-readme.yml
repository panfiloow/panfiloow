name: Update README Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Update timestamp in README
        run: |
          # Обновляем или добавляем timestamp в README
          if grep -q "Last updated:" README.md; then
            sed -i "s/Last updated:.*/Last updated: $(date '+%Y-%m-%d %H:%M:%S UTC')/" README.md
          else
            echo -e "\n\n---\n*Last updated: $(date '+%Y-%m-%d %H:%M:%S UTC')*" >> README.md
          fi
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "📊 Update stats - $(date '+%Y-%m-%d %H:%M')"
          git push
